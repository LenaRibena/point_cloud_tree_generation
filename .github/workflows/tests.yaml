name: Run tests

on:
  push:
    branches: [ master, main, bucket ]
  pull_request:
    branches: [ master, main, bucket ]

jobs:
  build:

    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.11, 3.12]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Goocle Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
          version: 'latest'

    - name: Check GCP authentication
      run: |
        gcloud auth list

    - name: Download data from GCP_SERVICE_ACCOUNT
      run: |
        gsutil cp gs://data-tree/processed_data/*.npy .

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --use-pep517 -r requirements.txt
        pip install --use-pep517 -r requirements_dev.txt
        pip install -e .

    - name: Test with pytest
      run: |
        pytest tests/ -v --data data/processed
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

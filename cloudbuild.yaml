steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build container image'
  args: [
    'build',
    '.',
    '-t',
    'europe-west1-docker.pkg.dev/dtu-mlops-tree/tree/$_IMAGE_NAME',
    '-f',
    'dockerfiles/cloud.dockerfile'
  ]
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push container image'
  args: [
    'push',
    'europe-west1-docker.pkg.dev/dtu-mlops-tree/tree/$_IMAGE_NAME'
  ]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE_NAME: 'train'

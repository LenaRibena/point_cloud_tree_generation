# Dataset parameters
data_path:
- "data"
- "processed"
- "urban_tree_dataset_better_sampled"
transform:
preload_data_into_cpu: true
standardize_data: true
train_split: 0.8
val_split: 0.1
test_split: 0.1

# Training parameters
epochs: 300
batch_size: 64
lr: 2e-3
weight_decay: 0
kl_weight: 0.001
patience: 30
delta: 1e-4

# Autoencoder parameters
latent_dim: 256
residual: false

# Flow VAE parameters
latent_flow_depth: 14
latent_flow_hidden_dim: 256

# Variance scheduler parameters
num_steps: 100
beta_1: 0.0001
beta_T: 0.02
sched_mode: "linear"

# Model parameters
device: "cuda"
model: "flow"
seed: 32
num_workers: 0
max_grad_norm: 10
spectral_norm: false

# Folder where experiments are saved to
experiments_folder: "./models"

# Debugging
debug: false

# Auto generated during runtime, will be overwritten
experiment_output_dir: "./outputs\\2025-01-23-14-20"
hydra:
  run:
    dir: "./outputs\\2025-01-23-14-20"

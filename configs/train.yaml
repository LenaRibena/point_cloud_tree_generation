# Dataset parameters
data_path:
- "data"
- "raw"
- "urban_tree_dataset"
transform:
train_split: 0.8
val_split: 0.1
test_split: 0.1

# Training parameters
epochs: 3
batch_size: 2
lr: 1e-3
weight_decay: 1e-5
kl_weight: 1e-1
patience: 5
delta: 1e-2

# Autoencoder parameters
latent_dim: 128
residual: false

# Variance scheduler parameters
num_steps: 10
beta_1: 0.9
beta_T: 0.999
sched_mode: "linear"

# Model parameters
device: "cpu"
model: "gaussian"
seed: 32
num_workers: 0
max_grad_norm: 1.0
spectral_norm: false

debug: false
hydra:
  run:
    dir: ./outputs
